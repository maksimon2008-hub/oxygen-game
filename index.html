import sys
import asyncio
import platform
import json
import shutil
from pathlib import Path

# do not rename
async def custom_site():
    import embed
    platform.document.body.style.background = "#070A19";

    platform.window.transfer.hidden = false
    platform.window.canvas.style.visibility = "hidden"


    bundle = "oxygen_web"

    # the C or js loader could do that but be explicit.
    appdir = Path(f"/data/data/{bundle}") # /data/data/oxygen_web
    # Remove the previous extracted package before unpacking. This prevents
    # stale files from an older archive (including the old bundled save) from
    # surviving an update in the browser's persistent filesystem.
    shutil.rmtree(appdir.as_posix(), ignore_errors=True)
    appdir.mkdir(parents=True, exist_ok=True)


    # unpack filesystem from compressed archive into work dir
    if platform.window.location.host.find('.itch.zone')>0:
        import zipfile
        async with platform.fopen("oxygen_web.apk", "rb") as archive:
            with zipfile.ZipFile(archive) as zip_ref:
                zip_ref.extractall(appdir.as_posix())
    else:
        import tarfile
        async with platform.fopen("oxygen_web.tar.gz?v=20261116-save-v2", "rb") as archive:
            tar = tarfile.open(fileobj=archive, mode="r:gz")
            tar.extractall(path=appdir.as_posix(), filter='tar')
            tar.close()

    # preloader will change to work dir and prepend it to sys.path
    platform.run_main(PyConfig, loaderhome= appdir / "assets", loadermain=None)


    # wait preloading complete : that includes images and wasm compilation of bundled modules
    while embed.counter()<0:
        await asyncio.sleep(.1)

    main = appdir / "assets" / "main.py"

    # TODO: test for window.webkitAudioContext and block aio loop until gesture if accessing media manager play
    # before a gesture is recorded ( touch or click )

    # test/wait user media interaction
    if not platform.window.MM.UME:

        # now that apk is mounted we have access to font cache
        # but we need to fill __file__ that is not yet set
        __import__(__name__).__file__ = main

        # now make a prompt
        msg  = "Нажмите, чтобы войти в OXYGEN"
        platform.window.infobox.innerText = msg
        platform.window.document.getElementById("status").innerText = "SYSTEM READY"
        platform.window.document.getElementById("loader-prompt").style.display = "inline-flex"
        print("\\n"*4, f"    * Waiting for media user engagement. {msg} *" , "\\n"*4)

        while not platform.window.MM.UME:
            await asyncio.sleep(.1)

    # start async top level machinery if not started and add a console in any case if requested.
    await TopLevel_async_handler.start_toplevel(platform.shell, console=window.python.config.debug)

    # now that apk is mounted we have access to font cache
    # but we need to fill __file__/__name__ that are not yet set
    __import__(__name__).__file__ = main


    def ui_callback(pkg):
        platform.window.infobox.innerText = f"installing {pkg}"

    await shell.source(main, callback=ui_callback)

    # if you don't reach that step
    # your main.py has an infinite sync loop somewhere !

    platform.window.infobox.style.display = "none"
    platform.window.canvas.style.visibility = "visible"
    platform.document.getElementById("oxygen-loader").style.display = "none"
    platform.window.config.gui_divider = 1
    platform.window.window_resize()
    print("default.tmpl: done")

    shell.interactive()

asyncio.run( custom_site() )

    <script type="application/javascript">
    (() => {
        // Let the browser handle F11 natively. Using the Fullscreen API for
        // F11 makes Escape leave the canvas fullscreen instead of reaching
        // the game's pause handler. Native browser fullscreen keeps Escape
        // available to OXYGEN. Alt+Enter and double-click remain optional
        // canvas-fullscreen shortcuts (Escape exits those modes by browser design).
        const gameCanvas = document.getElementById("canvas");
        async function toggleGameFullscreen() {
            try {
                if (document.fullscreenElement) {
                    await document.exitFullscreen();
                } else if (gameCanvas && gameCanvas.requestFullscreen) {
                    await gameCanvas.requestFullscreen({ navigationUI: "hide" });
                }
            } catch (error) {
                console.warn("OXYGEN fullscreen request was blocked:", error);
            }
        }

        document.addEventListener("keydown", event => {
            if (event.key === "Enter" && event.altKey) {
                event.preventDefault();
                toggleGameFullscreen();
            }
        }, true);

        if (gameCanvas) {
            gameCanvas.addEventListener("dblclick", event => {
                event.preventDefault();
                toggleGameFullscreen();
            });
        }

        // Enable touch controls only on devices that actually support touch.
        if (("ontouchstart" in window) || navigator.maxTouchPoints > 0) {
            document.documentElement.classList.add("touch-device");
        }
        const stick = document.getElementById("mobile-stick");
        const knob = document.getElementById("mobile-stick-knob");
        const jump = document.getElementById("mobile-jump");
        const fire = document.getElementById("mobile-fire");
        const menu = document.getElementById("mobile-menu");
        if (!stick || !knob || !jump || !fire || !menu) return;

        window.oxygen_touch_axis = 0;
        window.oxygen_touch_jump = false;
        window.oxygen_touch_jump_held = false;
        window.oxygen_touch_fire = false;
        window.oxygen_touch_dash = false;
        window.oxygen_touch_menu = false;
        // Queue taps instead of relying on a short click/hold that the
        // Python game loop could miss on a high-latency mobile frame.
        menu.addEventListener("pointerdown", event => {
            event.preventDefault();
            window.oxygen_touch_menu = true;
        });

        let activePointer = null;
        function moveStick(event) {
            if (activePointer !== event.pointerId) return;
            const rect = stick.getBoundingClientRect();
            const dx = event.clientX - (rect.left + rect.width / 2);
            const dy = event.clientY - (rect.top + rect.height / 2);
            const limit = rect.width * 0.34;
            const x = Math.max(-1, Math.min(1, dx / limit));
            const y = Math.max(-1, Math.min(1, dy / limit));
            window.oxygen_touch_axis = Math.abs(x) < 0.13 ? 0 : x;
            knob.style.transform = "translate(" + (x * limit) + "px," + (y * limit) + "px)";
        }
        function releaseStick(event) {
            if (activePointer !== event.pointerId) return;
            activePointer = null;
            window.oxygen_touch_axis = 0;
            knob.style.transform = "translate(0,0)";
        }
        stick.addEventListener("pointerdown", event => {
            event.preventDefault();
            activePointer = event.pointerId;
            stick.setPointerCapture(event.pointerId);
            moveStick(event);
        });
        stick.addEventListener("pointermove", event => {
            event.preventDefault();
            moveStick(event);
        });
        stick.addEventListener("pointerup", releaseStick);
        stick.addEventListener("pointercancel", releaseStick);

        function bindHold(button, key) {
            button.addEventListener("pointerdown", event => {
                event.preventDefault();
                if (key === "oxygen_touch_jump") {
                    // Queue the tap and keep the held state for variable jump height.
                    window[key] = true;
                    window.oxygen_touch_jump_held = true;
                    button.setPointerCapture(event.pointerId);
                } else {
                    button.setPointerCapture(event.pointerId);
                    if (button.getAttribute("data-action") === "dash") {
                        window.oxygen_touch_dash = true;
                    } else {
                        window.oxygen_touch_fire = true;
                    }
                }
            });
            ["pointerup", "pointercancel", "lostpointercapture"].forEach(name =>
                button.addEventListener(name, () => {
                    if (key === "oxygen_touch_jump") {
                        window.oxygen_touch_jump_held = false;
                    } else {
                        window.oxygen_touch_fire = false;
                    }
                })
            );
        }
        bindHold(jump, "oxygen_touch_jump");
        bindHold(fire, "oxygen_touch_fire");

        // Extra protection for mobile Safari's gesture and double-tap zoom.
        document.addEventListener("gesturestart", event => event.preventDefault(), { passive: false });
        document.addEventListener("dblclick", event => event.preventDefault(), { passive: false });

        const prompt = document.getElementById("loader-prompt");
        if (prompt) prompt.addEventListener("click", () => {
            try {
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock("landscape").catch(() => {});
                }
            } catch (_) {}
        });
    })();
