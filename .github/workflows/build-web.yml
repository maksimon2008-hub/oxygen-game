name: Build OXYGEN web archive

on:
  push:
    branches: [main]
    paths:
      - "oxygen_web/**"
      - "neon_ruins_platformer/**"
      - "tests/**"
      - ".github/workflows/build-web.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate browser Python source
        run: |
          set -euo pipefail
          python3 -m py_compile neon_ruins_platformer/main.py oxygen_web/main.py
          python3 -m unittest discover -s tests -v
          python3 -m pip install --disable-pip-version-check "pygame-ce>=2.5.3"
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy python3 tests/smoke_sector01.py

      - name: Package browser game
        run: |
          set -euo pipefail
          rm -rf /tmp/oxygen-web-package
          mkdir -p /tmp/oxygen-web-package/assets
          cp oxygen_web/main.py /tmp/oxygen-web-package/assets/main.py
          cp -a oxygen_web/assets /tmp/oxygen-web-package/assets/assets
          cp -a oxygen_web/locales /tmp/oxygen-web-package/assets/locales
          tar -czf oxygen_web.tar.gz -C /tmp/oxygen-web-package assets
          echo "Archive contents:"
          tar -tzf oxygen_web.tar.gz > /tmp/oxygen-archive-contents.txt
          sed -n '1,40p' /tmp/oxygen-archive-contents.txt
          test -s oxygen_web.tar.gz
          grep -qx 'assets/main.py' /tmp/oxygen-archive-contents.txt
          grep -qx 'assets/locales/ru.json' /tmp/oxygen-archive-contents.txt
          if grep -Eq '(^|/)savegame[.]json$' /tmp/oxygen-archive-contents.txt; then
            echo "ERROR: browser archive must never contain a bundled savegame"
            exit 1
          fi

      - name: Commit updated browser archive
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oxygen_web.tar.gz
          if git diff --cached --quiet; then
            echo "Browser archive is already up to date."
            exit 0
          fi
          git commit -m "Build updated OXYGEN browser archive"
          git push origin HEAD:main
